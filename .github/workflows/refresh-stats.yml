name: Refresh stats

on:
  schedule:
    - cron: "30 5 * * *"   # tous les jours à 05h30 UTC
  workflow_dispatch: {}     # bouton "Run workflow" manuel

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest stats
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: node fetch-data.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json index.html; then
            echo "No stat changes — nothing to commit."
          else
            git add data.json index.html
            git commit -m "chore: refresh player stats [skip ci]"
            git push
            echo "Stats updated and pushed."
          fi
